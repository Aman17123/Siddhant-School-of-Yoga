<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="380" height="180" fill="none">
  <!-- Subtle Sacred Himalayan Lotus Mandala & Prana Wave Motif (Unique to Siddhant School of Yoga) -->
  <g stroke="#175f52" stroke-width="0.85" opacity="0.32" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Concentric Sacred Circles -->
    <circle cx="90" cy="130" r="75" stroke-dasharray="2 3" />
    <circle cx="90" cy="130" r="55" />
    <circle cx="90" cy="130" r="38" stroke-dasharray="4 2" />
    <circle cx="90" cy="130" r="20" />
    <circle cx="90" cy="130" r="6" />

    <!-- 12-Petal Sacred Mandala Lotus Blossoms -->
    <!-- Cardinal Petals -->
    <path d="M 90 110 C 82 96, 98 96, 90 75 C 82 96, 98 96, 90 110 Z" />
    <path d="M 90 150 C 82 164, 98 164, 90 185 C 82 164, 98 164, 90 150 Z" />
    <path d="M 70 130 C 56 122, 56 138, 35 130 C 56 122, 56 138, 70 130 Z" />
    <path d="M 110 130 C 124 122, 124 138, 145 130 C 124 122, 124 138, 110 130 Z" />

    <!-- Diagonal Petals -->
    <path d="M 76 116 C 63 105, 75 93, 52 88 C 65 99, 53 111, 76 116 Z" />
    <path d="M 104 116 C 117 105, 105 93, 128 88 C 115 99, 127 111, 104 116 Z" />
    <path d="M 76 144 C 63 155, 75 167, 52 172 C 65 161, 53 149, 76 144 Z" />
    <path d="M 104 144 C 117 155, 105 167, 128 172 C 115 161, 127 149, 104 144 Z" />

    <!-- Radiating Sun Rays / Light Emanation -->
    <line x1="90" y1="52" x2="90" y2="35" stroke-dasharray="3 3" />
    <line x1="145" y1="75" x2="158" y2="62" stroke-dasharray="3 3" />
    <line x1="168" y1="130" x2="185" y2="130" stroke-dasharray="3 3" />
    <line x1="35" y1="75" x2="22" y2="62" stroke-dasharray="3 3" />
    <line x1="12" y1="130" x2="0" y2="130" stroke-dasharray="3 3" />

    <!-- Flowing Pranic Ganga Waterlines Flowing Rightward -->
    <path d="M 145 142 C 180 135, 210 148, 250 142 C 290 136, 330 146, 375 140" stroke-width="0.75" />
    <path d="M 155 152 C 190 146, 225 158, 265 152 C 305 146, 345 156, 380 150" stroke-width="0.75" stroke-dasharray="6 3" />
    <path d="M 135 162 C 175 156, 215 168, 255 162 C 295 156, 335 166, 375 160" stroke-width="0.6" />
    <path d="M 170 172 C 210 166, 245 178, 285 172 C 325 166, 355 174, 380 170" stroke-width="0.5" />

    <!-- Botanical Fern / Vine Flourish -->
    <path d="M 175 125 C 195 110, 220 112, 240 98 C 250 90, 265 85, 280 88" stroke-width="0.7" />
    <!-- Vine Leaves -->
    <path d="M 195 110 C 192 102, 202 104, 202 108" />
    <path d="M 215 112 C 218 104, 226 108, 224 114" />
    <path d="M 235 101 C 232 93, 242 95, 241 100" />
    <path d="M 255 90 C 258 82, 267 86, 264 92" />
  </g>
</svg>
