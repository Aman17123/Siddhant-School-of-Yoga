<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" fill="none">
  <!-- Rishikesh Ancient Ashram Temple & Sacred Lotus for Siddhant School of Yoga -->
  <g stroke="#175f52" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <!-- Mountain Backdrop -->
    <path d="M40 70 L90 30 L150 72 L210 26 L270 65 L320 35" stroke-dasharray="3 1" stroke-width="0.9" opacity="0.5" />
    <path d="M10 88 L65 52 L125 84 L185 45 L245 80 L310 52" stroke-width="1.1" opacity="0.7" />

    <!-- Traditional Multi-tiered Himalayan Ashram Temple (Right) -->
    <g transform="translate(195, 15) scale(0.85)">
      <!-- Temple Spire Kalash / Flag -->
      <path d="M50 8 L50 2 M50 2 L56 5 L50 8" stroke="#f22924" stroke-width="1.2" />
      <circle cx="50" cy="10" r="2.5" />
      
      <!-- Tier 1 (Top Shikhara) -->
      <path d="M44 14 L50 9 L56 14" stroke-width="1.3" />
      <path d="M42 18 L58 18 L56 26 L44 26 Z" />
      
      <!-- Tier 2 (Middle Pagoda Roof) -->
      <path d="M36 28 C42 26, 58 26, 64 28 L62 42 L38 42 Z" stroke-width="1.3" />
      <!-- Arch windows -->
      <path d="M46 38 C46 34, 54 34, 54 38" />

      <!-- Tier 3 (Broad Base Roof) -->
      <path d="M28 44 C38 41, 62 41, 72 44 L70 68 L30 68 Z" stroke-width="1.4" />
      <path d="M38 68 L38 56 C38 50, 62 50, 62 56 L62 68" />
      <!-- Temple Doorway Steps -->
      <path d="M44 68 L44 58 C44 54, 56 54, 56 58 L56 68" stroke-width="1.2" />
      <path d="M24 72 L76 72 M20 76 L80 76 M16 80 L84 80" stroke-width="1.2" />
      <!-- Little hanging bells -->
      <path d="M30 46 L30 49 M70 46 L70 49 M38 30 L38 33 M62 30 L62 33" stroke-width="0.9" />
    </g>

    <!-- Sacred Lotus Flower (Center/Left) -->
    <g transform="translate(90, 65) scale(0.65)" stroke="#c9a961" stroke-width="1.1" opacity="0.8">
      <!-- Center Petal -->
      <path d="M35 15 C30 25, 30 40, 35 45 C40 40, 40 25, 35 15 Z" />
      <!-- Left Petals -->
      <path d="M35 45 C20 40, 15 25, 22 18 C28 25, 33 35, 35 45 Z" />
      <path d="M35 45 C12 42, 5 30, 12 24 C18 30, 28 38, 35 45 Z" />
      <!-- Right Petals -->
      <path d="M35 45 C50 40, 55 25, 48 18 C42 25, 37 35, 35 45 Z" />
      <path d="M35 45 C58 42, 65 30, 58 24 C52 30, 42 38, 35 45 Z" />
      <!-- Water ripple ripples below lotus -->
      <path d="M10 50 C25 47, 45 47, 60 50" stroke-width="0.8" />
    </g>

    <!-- Sacred Incense / Prana Wind Swirls -->
    <path d="M140 25 C145 18, 155 22, 160 16 C165 10, 158 5, 165 2" stroke-dasharray="2 2" stroke-width="0.9" opacity="0.6" />
    <path d="M150 32 C155 26, 163 29, 168 23 C172 18, 168 12, 175 8" stroke-dasharray="2 2" stroke-width="0.9" opacity="0.5" />
  </g>
</svg>
