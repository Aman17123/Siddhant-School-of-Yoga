<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" fill="none">
  <!-- Soft Himalayan Mountain Ridges & Sunrise for Siddhant School of Yoga -->
  <g stroke="#175f52" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4">
    <!-- Far Peaks -->
    <path d="M-10 85 L35 45 L75 75 L120 35 L165 70 L210 25 L260 70 L300 40 L340 85" stroke-dasharray="3 1" stroke-width="0.9" opacity="0.6" />
    
    <!-- Morning Sun rising behind peaks -->
    <circle cx="120" cy="35" r="14" stroke="#c9a961" stroke-width="1" fill="none" opacity="0.7" />
    <path d="M120 15 L120 10 M134 21 L138 18 M139 35 L144 35 M106 21 L102 18 M101 35 L96 35" stroke="#c9a961" stroke-width="0.9" opacity="0.7" />

    <!-- Mid Mountain Range with sketch hatching -->
    <path d="M-5 95 L45 55 L90 85 L145 48 L195 80 L250 50 L305 92" stroke-width="1.3" />
    <!-- Ridge Hatching Lines -->
    <path d="M45 55 L35 75 M45 55 L40 80 M45 55 L50 78 M145 48 L135 70 M145 48 L142 75 M145 48 L152 72 M250 50 L242 72 M250 50 L248 78 M250 50 L258 75" stroke-width="0.7" opacity="0.5" />

    <!-- Fore Ridge -->
    <path d="M-10 110 L25 78 L70 102 L115 72 L170 105 L225 76 L280 108" stroke-width="1.4" />
    <path d="M25 78 L18 96 M25 78 L23 100 M115 72 L108 92 M115 72 L116 98 M225 76 L218 96 M225 76 L226 100" stroke-width="0.7" opacity="0.5" />

    <!-- Holy Ganges River Waves -->
    <path d="M-10 115 C20 110, 50 118, 90 114 C130 110, 170 117, 210 113 C250 109, 290 116, 330 112" stroke-width="1.2" opacity="0.8" />
    <path d="M10 119 C40 116, 80 121, 120 118 C160 115, 200 120, 240 117 C270 115, 300 119, 330 117" stroke-width="0.8" opacity="0.5" />

    <!-- Meditating Yogi by the Shore -->
    <g transform="translate(60, 88) scale(0.65)">
      <!-- Head -->
      <circle cx="20" cy="10" r="3.5" stroke-width="1.2" />
      <!-- Torso -->
      <path d="M20 13.5 L20 28" stroke-width="1.4" />
      <!-- Crossed Legs (Padmasana) -->
      <path d="M10 32 C13 28, 27 28, 30 32 C28 34, 12 34, 10 32 Z" stroke-width="1.2" />
      <!-- Arms in Dhyana Mudra -->
      <path d="M14 18 L10 26 L20 28 L30 26 L26 18" stroke-width="1.1" />
    </g>
  </g>
</svg>
